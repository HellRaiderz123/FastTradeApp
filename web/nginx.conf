server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstream hostnames are re-resolved dynamically.
    # This prevents 502s after backend container restarts (stale IP cache).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket connections under /api/ws/
    location /api/ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Swagger UI docs (proxy directly, preserving paths)
    location /api/docs {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /api/redoc {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/redoc;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Proxy REST API
    location /api/ {
        set $upstream_backend backend;
        # With variable-based proxy_pass, explicitly rewrite URI so /api/* -> /*.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy WebSocket connections
    location /ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
