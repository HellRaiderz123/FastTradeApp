<!DOCTYPE html>
<html>
<head>
    <title>Test Market API</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #fff; }
        button { padding: 10px; margin: 5px; background: #007acc; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #005a9e; }
        .result { background: #2d2d2d; padding: 10px; margin: 10px 0; border-left: 3px solid #007acc; white-space: pre-wrap; overflow-x: auto; }
        .error { border-left-color: #f44747; color: #f44747; }
    </style>
</head>
<body>
    <h1>Market Data API Tester</h1>
    
    <div>
        <button onclick="testLTP()">Test LTP</button>
        <button onclick="testExpiries()">Test Expiries</button>
        <button onclick="testPremium()">Test Premium</button>
        <button onclick="testAll()">Test All</button>
        <button onclick="clearResults()">Clear</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function log(title, data, isError = false) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result' + (isError ? ' error' : '');
            resultDiv.textContent = title + '\n' + JSON.stringify(data, null, 2);
            resultsDiv.appendChild(resultDiv);
            console.log(title, data);
        }
        
        async function testLTP() {
            try {
                console.log('Testing LTP...');
                const response = await fetch(`${API_BASE}/market/ltp/NIFTY`);
                const data = await response.json();
                log('✅ LTP Response:', data);
            } catch (err) {
                log('❌ LTP Error:', err.message, true);
            }
        }
        
        async function testExpiries() {
            try {
                console.log('Testing Expiries...');
                const response = await fetch(`${API_BASE}/market/expiries/NIFTY`);
                const data = await response.json();
                log('✅ Expiries Response:', data);
            } catch (err) {
                log('❌ Expiries Error:', err.message, true);
            }
        }
        
        async function testPremium() {
            try {
                console.log('Testing Premium...');
                const response = await fetch(`${API_BASE}/market/option-premium?symbol=NIFTY&strike=26000&option_type=CE&expiry=2026-01-08`);
                const data = await response.json();
                log('✅ Premium Response:', data);
            } catch (err) {
                log('❌ Premium Error:', err.message, true);
            }
        }
        
        async function testAll() {
            await testLTP();
            await testExpiries();
            await testPremium();
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on load
        window.onload = () => {
            log('Page loaded', 'Testing Market APIs from localhost:8000');
            testAll();
        };
    </script>
</body>
</html>
