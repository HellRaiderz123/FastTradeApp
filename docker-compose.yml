version: "3.9"

services:

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # Data lives in named volume — survives container stop/start/rebuild
  # Only lost if you run: docker-compose down -v  (never do this)
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fasttrade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasttrade
      POSTGRES_USER: fasttrade
      POSTGRES_PASSWORD: your_new_password
    volumes:
      - fasttrade_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasttrade -d fasttrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fasttrade-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/models:/app/models
      - ./backend/data/ml_models:/app/data/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ─────────────────────────────────────────
  # Ollama — offline LLM for AI chatbot
  # Pull a model after first start:
  #   docker exec fasttrade-ollama ollama pull llama3.2:3b
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama
    container_name: fasttrade-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ─────────────────────────────────────────
  # React Web UI (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fasttrade-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fasttrade_pgdata:
  ollama_data:
    # Named volume — Docker manages this on the host
    # Location: /var/lib/docker/volumes/fasttrade_pgdata/_data
    # Survives: docker-compose down, docker-compose up --build, container restarts
    # WARNING: docker-compose down -v  will DELETE this volume
