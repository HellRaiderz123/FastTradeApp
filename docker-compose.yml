version: '3.8'

services:
  fasttrade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fasttrade-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      # Add other environment variables as needed
    volumes:
      # Mount only necessary runtime data, not source code
      - ./backend/trading.db:/app/backend/trading.db
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
