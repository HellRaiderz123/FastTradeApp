services:

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # Data lives in named volume — survives container stop/start/rebuild
  # Only lost if you run: docker-compose down -v  (never do this)
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fasttrade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasttrade
      POSTGRES_USER: fasttrade
      POSTGRES_PASSWORD: your_new_password
    volumes:
      - fasttrade_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasttrade -d fasttrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fasttrade-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/app/models
      - ./backend/data/ml_models:/app/data/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────
  # React Web UI (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fasttrade-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fasttrade_pgdata:
