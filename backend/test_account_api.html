<!DOCTYPE html>
<html>
<head>
    <title>Test Account API</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 10px 0; padding: 10px; background: #333; border-radius: 5px; }
        .success { color: #10B981; }
        .error { color: #EF4444; }
        pre { background: #000; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FastTrade Backend API Test</h1>
    
    <div class="test">
        <h3>Testing /account/profile</h3>
        <button onclick="testProfile()">Run Test</button>
        <div id="profile-result"></div>
    </div>

    <div class="test">
        <h3>Testing /account/capital</h3>
        <button onclick="testCapital()">Run Test</button>
        <div id="capital-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function testProfile() {
            try {
                const response = await fetch(`${API_BASE}/account/profile`);
                const data = await response.json();
                document.getElementById('profile-result').innerHTML = 
                    `<p class="success">✓ Status: ${response.status}</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('profile-result').innerHTML = 
                    `<p class="error">✗ Error: ${error.message}</p>`;
            }
        }

        async function testCapital() {
            try {
                const response = await fetch(`${API_BASE}/account/capital`);
                const data = await response.json();
                document.getElementById('capital-result').innerHTML = 
                    `<p class="success">✓ Status: ${response.status}</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('capital-result').innerHTML = 
                    `<p class="error">✗ Error: ${error.message}</p>`;
            }
        }

        // Auto-test on load
        window.onload = () => {
            testProfile();
            testCapital();
        };
    </script>
</body>
</html>
